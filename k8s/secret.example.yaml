# Template only. Copy to secret.yaml, set a real password, then apply.
# secret.yaml is git-ignored so real credentials never reach the repo.
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  namespace: ecommerce
  labels:
    app.kubernetes.io/part-of: ecommerce
type: Opaque
stringData:
  POSTGRES_USER: "ecommerce"
  POSTGRES_PASSWORD: "change-me"
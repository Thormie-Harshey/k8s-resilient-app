apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-html
  namespace: ecommerce
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: ecommerce
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>Resilient Shop</title>
      <style>
        body { font-family: sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; }
        li { padding: 6px 0; }
        .muted { color: #666; font-size: 14px; }
      </style>
    </head>
    <body>
      <h1>Resilient Shop</h1>
      <p class="muted">Served by nginx on Kubernetes. Products come from /api/products.</p>
      <ul id="products"><li>Loading...</li></ul>
      <p class="muted" id="source"></p>
      <script>
        fetch('/api/products')
          .then(function (r) { return r.json(); })
          .then(function (data) {
            var list = document.getElementById('products');
            list.innerHTML = '';
            data.products.forEach(function (p) {
              var li = document.createElement('li');
              li.textContent = p.name + ' (' + p.price + ')';
              list.appendChild(li);
            });
            document.getElementById('source').textContent = 'Answered from: ' + data.source;
          })
          .catch(function () {
            document.getElementById('products').innerHTML = '<li>API not reachable</li>';
          });
      </script>
    </body>
    </html>